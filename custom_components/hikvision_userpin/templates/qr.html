<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR teilen</title>
    <style>
      :root { --bg: #f7f7fb; --panel: #fff; --text: #111827; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --panel: #1f2937; --text: #e5e7eb; } }
      body { font-family: Arial, sans-serif; margin: 0 auto; padding: 24px; max-width: 640px; background: var(--bg); text-align: center; color: var(--text); }
      .card { background: var(--panel); padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
      img { max-width: 280px; width: 100%; height: auto; }
      .btn { display: inline-block; margin: 8px; padding: 10px 16px; border-radius: 6px; text-decoration: none; color: #fff; }
      .btn-download { background: #1f6feb; }
      .btn-secondary { background: #374151; color: #fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>QR für {{ name or value }}</h2>
      <img src="data:image/png;base64,{{ qr_data }}" alt="QR Code" />
      <div>
        <a class="btn btn-download" href="{{ download_link }}">Download</a>
        <a class="btn btn-secondary" href="{{ panel_url }}/panel{% if entry_id %}?entry_id={{ entry_id }}{% endif %}">Zurück zur Startseite</a>
      </div>
    </div>
  </body>
</html>
