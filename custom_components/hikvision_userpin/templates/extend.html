<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verlängern</title>
    <style>
      :root { --bg: #f7f7fb; --panel: #fff; --text: #111827; --border: #e5e5e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --panel: #1f2937; --text: #e5e7eb; --border: #374151; } }
      body { font-family: Arial, sans-serif; margin: 0 auto; padding: 24px; max-width: 640px; background: var(--bg); color: var(--text); }
      .card { background: var(--panel); padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
      label { display: block; font-weight: 600; margin-top: 12px; }
      select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--panel); color: var(--text); }
      button { margin-top: 12px; padding: 10px 16px; background: #1f6feb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background: #1558c0; }
      a { text-decoration: none; }
      .btn-secondary { display: inline-block; margin-top: 12px; padding: 10px 16px; border-radius: 6px; background: #374151; color: #fff; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Verlängern: {{ name or employee_no }}</h2>
      <p>Aktuell gültig: {{ current_end }}</p>
      <form method="post" action="{{ panel_url }}/extend/{{ employee_no }}">
        <input type="hidden" name="entry_id" value="{{ entry_id }}">
        <input type="hidden" name="begin_date" value="{{ begin_date }}">
        <input type="hidden" name="current_end" value="{{ current_end }}">
        <label for="duration">Verlängern um</label>
        <select id="duration" name="duration">
          <option value="1d">1 Tag</option>
          <option value="7d">7 Tage</option>
          <option value="14d">14 Tage</option>
          <option value="4w">4 Wochen</option>
          <option value="3m">3 Monate</option>
          <option value="12m">12 Monate</option>
          <option value="forever">immer</option>
        </select>
        <button type="submit">Speichern</button>
      </form>
      <a class="btn-secondary" href="{{ panel_url }}/panel{% if entry_id %}?entry_id={{ entry_id }}{% endif %}">Zurück zur Startseite</a>
    </div>
  </body>
</html>
